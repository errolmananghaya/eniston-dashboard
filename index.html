<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Knowledge Base Login</title>

    <!-- Microsoft Authentication Library -->
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f6fa;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 14px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.12);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            font-size: 28px;

            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;

            margin-bottom: 30px;

            font-size: 14px;

            line-height: 1.5;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;

            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.5;

            display: none;
        }

        .success {
            display: block !important;

            background: #dcfce7;

            color: #166534;
        }

        .error {
            display: block !important;

            background: #fee2e2;

            color: #991b1b;
        }

        .info {
            display: block !important;

            background: #dbeafe;

            color: #1e40af;
        }

        .user-info {
            margin-top: 20px;

            text-align: left;

            background: #f9fafb;

            padding: 15px;

            border-radius: 8px;

            font-size: 14px;

            display: none;
        }

        .user-info strong {
            color: #374151;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Knowledge Base</h1>

    <div class="subtitle">
        Sign in with your Microsoft 365 account
        to access the Knowledge Base.
    </div>

    <button
        id="loginButton"
        onclick="login()">

        Sign in with Microsoft 365

    </button>

    <div id="status"></div>

    <div
        id="userInfo"
        class="user-info">

        <div>
            <strong>Name:</strong>
            <span id="userName"></span>
        </div>

        <div style="margin-top:8px;">
            <strong>Email:</strong>
            <span id="userEmail"></span>
        </div>

    </div>

</div>


<script>

    // =========================================================
    // MICROSOFT LOGIN CONFIGURATION
    // =========================================================

    const msalConfig = {

        auth: {

            clientId:
                "271835fa-f4fc-4a40-88bd-86284c63de88",

            authority:
                "https://login.microsoftonline.com/cfb75484-7ab4-4890-b396-acd3f3066d21",

            redirectUri:
                "https://errolmananghaya.github.io/eniston-dashboard/"
        },

        cache: {

            cacheLocation:
                "sessionStorage",

            storeAuthStateInCookie:
                false
        }
    };


    // =========================================================
    // MICROSOFT LOGIN SCOPES
    // =========================================================
    //
    // IMPORTANT:
    // We are NOT requesting Sites.ReadWrite.All.
    // We only need basic Microsoft sign-in.
    //

    const loginScopes = [
        "openid",
        "profile",
        "email"
    ];


    // =========================================================
    // ENISTON KNOWLEDGE BASE
    // =========================================================

    const enistonUrl =
        "https://voludici-kekoyata.eniston.com/";


    // =========================================================
    // CREATE MSAL INSTANCE
    // =========================================================

    const msalInstance =
        new msal.PublicClientApplication(
            msalConfig
        );


    // =========================================================
    // SHOW STATUS
    // =========================================================

    function showStatus(message, type) {

        const status =
            document.getElementById("status");

        status.innerHTML =
            message;

        status.className =
            type;
    }


    // =========================================================
    // BUTTON LOADING STATE
    // =========================================================

    function setLoading(isLoading) {

        const button =
            document.getElementById("loginButton");

        button.disabled =
            isLoading;

        button.innerText =
            isLoading
                ? "Signing in..."
                : "Sign in with Microsoft 365";
    }


    // =========================================================
    // SHOW USER INFORMATION
    // =========================================================

    function showUser(account) {

        document.getElementById(
            "userName"
        ).innerText =
            account.name || "Unknown";


        document.getElementById(
            "userEmail"
        ).innerText =
            account.username || "Unknown";


        document.getElementById(
            "userInfo"
        ).style.display =
            "block";
    }


    // =========================================================
    // HANDLE MICROSOFT REDIRECT
    // =========================================================

    async function handleRedirect() {

        try {

            const response =
                await msalInstance
                    .handleRedirectPromise();


            // No redirect result
            if (!response) {

                return;
            }


            console.log(
                "Microsoft login response:",
                response
            );


            const account =
                response.account;


            if (!account) {

                throw new Error(
                    "Microsoft login succeeded but no account was returned."
                );
            }


            // Set active Microsoft account

            msalInstance.setActiveAccount(
                account
            );


            // Show user

            showUser(account);


            // =================================================
            // CREATE IDENTITY FOR POC
            // =================================================

            const identity = {

                name:
                    account.name || "",

                upn:
                    account.username || "",

                created:
                    Date.now()
            };


            console.log(
                "Logged-in Microsoft identity:",
                identity
            );


            // =================================================
            // TEMPORARY IDENTITY TOKEN
            // =================================================
            //
            // This is ONLY for our current POC.
            //
            // It is Base64 encoded, not encrypted or signed.
            // We will replace this with a secure method later.
            //

            const identityJson =
                JSON.stringify(identity);


            const identityToken =
                btoa(identityJson);


            // Store identity locally

            sessionStorage.setItem(
                "activityTrackerIdentity",
                JSON.stringify(identity)
            );


            // =================================================
            // REDIRECT TO ENISTON
            // =================================================

            const redirectUrl =
                enistonUrl +
                "?t=" +
                encodeURIComponent(
                    identityToken
                );


            showStatus(
                "Login successful! Redirecting to Knowledge Base...",
                "success"
            );


            console.log(
                "Redirecting to:",
                enistonUrl
            );


            // Give the user a moment to see
            // the success message

            setTimeout(
                function () {

                    window.location.href =
                        redirectUrl;

                },
                700
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            showStatus(
                "Login failed:<br><br>" +
                (
                    error.message ||
                    error
                ),
                "error"
            );


            setLoading(false);
        }
    }


    // =========================================================
    // LOGIN
    // =========================================================

    async function login() {

        try {

            setLoading(true);


            showStatus(
                "Opening Microsoft 365 sign-in...",
                "info"
            );


            await msalInstance
                .loginRedirect({

                    scopes:
                        loginScopes
                });


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            showStatus(
                "Login failed:<br><br>" +
                (
                    error.message ||
                    error
                ),
                "error"
            );


            setLoading(false);
        }
    }


    // =========================================================
    // START APPLICATION
    // =========================================================

    async function start() {

        console.log(
            "Knowledge Base Login starting..."
        );


        try {

            const accounts =
                msalInstance
                    .getAllAccounts();


            if (
                accounts.length > 0
            ) {

                msalInstance
                    .setActiveAccount(
                        accounts[0]
                    );

            }


            await handleRedirect();


        } catch (error) {

            console.error(
                "Application initialization error:",
                error
            );


            showStatus(
                "Application error:<br><br>" +
                (
                    error.message ||
                    error
                ),
                "error"
            );
        }
    }


    // =========================================================
    // START
    // =========================================================

    start();

</script>

</body>

</html>
