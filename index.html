<style>
    * {
        box-sizing: border-box;

    body {
        margin: 0;
        min-height: 100vh;

            radial-gradient(
                circle at 20% 20%,

            ),

                transparent 35%
            ),
            #08111f;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
    }

    .background-glow {
        position: fixed;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: rgba(37, 99, 235, 0.10);

    .glow-one {

    .page {

    .logo {

        background: linear-gradient(

        align-items: center;

        font-size: 28px;

        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
    }

    .title {
        text-align: center;
        font-size: 30px;

        font-weight: 700;
        letter-spacing: -0.7px;
        margin: 0;
    }

    .subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 15px;
        margin: 10px 0 32px;

    .divider {
        height: 1px;

    .login-label {
        display: block;

    .microsoft-button {
        width: 100%;
        min-height: 54px;

        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition:
            transform 0.15s ease,

    .microsoft-button:hover {
        background: #f8fafc;
        transform: translateY(-1px);

```
<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<div class="page">

    <div class="login-card">

        <div class="logo-container">
            <div class="logo">
                G
            </div>
        </div>

        <h1 class="title">
            Welcome to GearUp
        </h1>

        <div class="subtitle">
            Knowledge Base
        </div>

        <div class="divider"></div>

        <span class="login-label">
            SIGN IN
        </span>

        <div class="login-description">
            Sign in with your Microsoft 365 account
            to access the GearUp Knowledge Base.
        </div>

        <button
            id="loginButton"
            class="microsoft-button"
        >
            <div class="ms-icon">
                <span class="ms-red"></span>
                <span class="ms-green"></span>
                <span class="ms-blue"></span>
                <span class="ms-yellow"></span>
            </div>

            <span id="loginText">
                Sign in with Microsoft 365
            </span>
        </button>

        <div id="status"></div>

        <div class="security-note">
            <span>🔒</span>
            <span>
                Secure Microsoft sign-in
            </span>
        </div>

    </div>

    <div class="footer">
        GearUp Knowledge Base
    </div>

</div>

<script>

    console.log("=================================");
    console.log("GEARUP MICROSOFT 365 LOGIN");
    console.log("=================================");

    /* =========================================================
       MICROSOFT ENTRA CONFIGURATION
    ========================================================= */

    const CLIENT_ID =
        "521291ef-e00a-4a35-84d5-1ea1222a1b17";

    const TENANT_ID =
        "cfb75484-7ab4-4890-b396-acd3f3066d21";

    const AUTHORITY =
        "https://login.microsoftonline.com/" +
        TENANT_ID;

    /* =========================================================
       LOCALHOST REDIRECT
    ========================================================= */

    const REDIRECT_URI =
        "http://localhost:5500/";

    /* =========================================================
       ENISTON KNOWLEDGE BASE
    ========================================================= */

    const ENISTON_URL =
        "https://kbservice.pinintel.com/";

    /* =========================================================
       LOGIN SCOPES
    ========================================================= */

    const LOGIN_SCOPES = [
        "openid",
        "profile",
        "email"
    ];

    /* =========================================================
       MSAL CONFIGURATION
    ========================================================= */

    const msalConfig = {
        auth: {
            clientId: CLIENT_ID,
            authority: AUTHORITY,
            redirectUri: REDIRECT_URI
        },

        cache: {
            cacheLocation: "sessionStorage",
            storeAuthStateInCookie: false
        }
    };

    const msalInstance =
        new msal.PublicClientApplication(
            msalConfig
        );

    /* =========================================================
       UI
    ========================================================= */

    const loginButton =
        document.getElementById("loginButton");

    const loginText =
        document.getElementById("loginText");

    function setStatus(message) {

        const status =
            document.getElementById("status");

        if (status) {
            status.textContent = message;
        }
    }

    /* =========================================================
       CREATE IDENTITY TOKEN
    ========================================================= */

    function createIdentityToken(account) {

        const identity = {
            name:
                account.name ||
                account.username ||
                "",

            upn:
                account.username ||
                "",

            created:
                Date.now()
        };

        console.log(
            "Microsoft identity:",
            identity
        );

        const identityJson =
            JSON.stringify(identity);

        const identityToken =
            btoa(
                unescape(
                    encodeURIComponent(
                        identityJson
                    )
                )
            );

        return identityToken;
    }

    /* =========================================================
       REDIRECT TO KNOWLEDGE BASE
    ========================================================= */

    function redirectToEniston(account) {

        const identityToken =
            createIdentityToken(account);

        const redirectUrl =
            ENISTON_URL +
            "?t=" +
            encodeURIComponent(
                identityToken
            );

        console.log(
            "Login successful."
        );

        console.log(
            "User:",
            account.name
        );

        console.log(
            "UPN:",
            account.username
        );

        console.log(
            "Redirecting to:",
            redirectUrl
        );

        setStatus(
            "Login successful. Opening Knowledge Base..."
        );

        window.location.href =
            redirectUrl;
    }

    /* =========================================================
       PROCESS LOGIN
    ========================================================= */

    async function processLogin() {

        try {

            console.log(
                "Processing Microsoft login..."
            );

            setStatus(
                "Checking Microsoft sign-in..."
            );

            const redirectResult =
                await msalInstance
                    .handleRedirectPromise();

            /* =================================================
               LOGIN JUST COMPLETED
            ================================================= */

            if (redirectResult) {

                console.log(
                    "Microsoft login completed."
                );

                if (
                    !redirectResult.account
                ) {

                    throw new Error(
                        "No Microsoft account was returned."
                    );
                }

                redirectToEniston(
                    redirectResult.account
                );

                return;
            }

            /* =================================================
               CHECK EXISTING SESSION
            ================================================= */

            const accounts =
                msalInstance.getAllAccounts();

            if (
                accounts &&
                accounts.length > 0
            ) {

                console.log(
                    "Existing Microsoft account found:",
                    accounts[0]
                );

                setStatus(
                    "Microsoft account detected. Click the button to continue."
                );

                return;
            }

            setStatus(
                "Ready to sign in."
            );

        } catch (error) {

            console.error(
                "Microsoft login error:",
                error
            );

            setStatus(
                "Login error. Please check the browser console."
            );
        }
    }

    /* =========================================================
       LOGIN BUTTON
    ========================================================= */

    loginButton.addEventListener(
        "click",
        async function () {

            try {

                loginButton.disabled =
                    true;

                loginText.textContent =
                    "Opening Microsoft 365...";

                setStatus(
                    "Connecting to Microsoft 365..."
                );

                await msalInstance
                    .loginRedirect({
                        scopes:
                            LOGIN_SCOPES,

                        redirectUri:
                            REDIRECT_URI
                    });

            } catch (error) {

                console.error(
                    "Login redirect error:",
                    error
                );

                loginButton.disabled =
                    false;

                loginText.textContent =
                    "Sign in with Microsoft 365";

                setStatus(
                    "Unable to start Microsoft login."
                );
            }
        }
    );

    /* =========================================================
       START
    ========================================================= */

    processLogin();

</script>
